name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New semantic version, for example 0.1.4"
        required: true
        type: string
      publish:
        description: "Publish the GitHub Release and Discord announcement"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sg-windows-release
  cancel-in-progress: false

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  build:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SG_Typer_Studio/desktop/package-lock.json

      - name: Configure this repository and release version
        working-directory: SG_Typer_Studio/desktop
        run: |
          npm run configure:github -- "https://github.com/${{ github.repository }}"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Load matching release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Enter a semantic version such as 0.1.4."
            exit 1
          fi
          FILE=".github/workflows/release-notes/${VERSION}.md"
          if [[ ! -s "$FILE" ]]; then
            echo "Create $FILE with the changes for this version before running the release."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        working-directory: SG_Typer_Studio/desktop
        run: npm ci

      - name: Build installer and update metadata
        working-directory: SG_Typer_Studio/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Save Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SG-Typer-Studio-${{ inputs.version }}-windows-x64
          path: |
            SG_Typer_Studio/desktop/dist/SG.Typer.Studio-Setup.exe
            SG_Typer_Studio/desktop/dist/SG.Typer.Studio-Setup.exe.blockmap
            SG_Typer_Studio/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Commit release configuration
        if: inputs.publish
        id: release_commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SG_Typer_Studio/desktop/package.json SG_Typer_Studio/desktop/package-lock.json SG_Typer_Studio/desktop/src/preload.js SG_Typer_Studio/web/whats-new.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v${{ inputs.version }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with all updater assets
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          NOTES_FILE: ${{ steps.release_notes.outputs.file }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          FILES=("SG_Typer_Studio/desktop/dist/SG.Typer.Studio-Setup.exe" "SG_Typer_Studio/desktop/dist/latest.yml")
          # Full NSIS updates work without differential blockmaps. Include one when a build emits it.
          if [[ -f "SG_Typer_Studio/desktop/dist/SG.Typer.Studio-Setup.exe.blockmap" ]]; then
            FILES+=("SG_Typer_Studio/desktop/dist/SG.Typer.Studio-Setup.exe.blockmap")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --draft=false --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${FILES[@]}" --target "$RELEASE_SHA" --title "SG Typer Studio ${{ inputs.version }}" --notes-file "$NOTES_FILE"
          fi

      - name: Send the completed release card to Discord
        if: inputs.publish && env.DISCORD_WEBHOOK_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: node .github/scripts/discord-release.js
